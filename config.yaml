# Конфигурация AsyncCrawler

# Основные настройки
max_concurrent: 10
max_depth: 3
max_pages: 100
requests_per_second: 1.0

# Задержки
min_delay: 0.5
max_delay: 10.0
jitter: 0.3
delay_between_requests: 0.5

# Таймауты
connect_timeout: 10
read_timeout: 30
total_timeout: 60

# User-Agent
user_agent: "AsyncCrawler/1.0 (+https://github.com/example/crawler)"
rotate_user_agent: false
user_agents: []

# Robots.txt
respect_robots: true
robots_cache_ttl: 3600
robots_user_agent: "AsyncCrawler"

# Фильтры URL
same_domain_only: true
exclude_patterns:
  - "\\.(jpg|jpeg|png|gif|svg|pdf|zip|rar|mp4|mp3|avi)$"
  - "#"
  - "\\?"
include_patterns: []

# Настройки повторов
retry:
  max_retries: 3
  backoff_factor: 2.0
  initial_delay: 1.0
  max_delay: 60.0
  retry_on_status_codes: [429, 500, 502, 503, 504]
  no_retry_status_codes: [400, 401, 403, 404, 405, 410]

# Circuit Breaker
circuit_breaker:
  enabled: true
  failure_threshold: 5
  success_threshold: 3
  timeout: 30.0
  half_open_max_calls: 3
  reset_timeout: 60.0

# Хранение данных
storage:
  storage_type: "sqlite"  # json, csv, sqlite, multi
  json_file: "crawler_results.json"
  json_indent: 2
  json_ensure_ascii: false
  csv_file: "crawler_results.csv"
  csv_delimiter: ","
  csv_encoding: "utf-8"
  sqlite_db: "crawler.db"
  sqlite_batch_size: 100
  batch_size: 100
  flush_interval: 5.0

# Логирование
log_level: "INFO"
log_file: "crawler.log"

# Прогресс
show_progress: true
progress_interval: 1.0

# Стартовые URL (используются, если --urls не передан)
start_urls:
  - "https://example.com"

# Парсинг
parse_html: true
extract_links: true
extract_text: true
extract_metadata: true

# Прокси (опционально)
# proxy: "http://user:pass@proxy.example.com:8080"